version: '3.9'

services:
  starter-prismakit-production:
    container_name: starter-prismakit-production
    build:
      context: ../
      dockerfile: ./build/Dockerfile.production
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL_SEED: ${ADMIN_EMAIL_SEED}
      ADMIN_PASSWORD_SEED: ${ADMIN_PASSWORD_SEED}
      SWAGGER_USERNAME: ${SWAGGER_USERNAME}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD}
      RUN_SEED: ${RUN_SEED:-0}
      REDIS_HOST: ${REDIS_HOST:-starter-prismakit-redis-production}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PREFIX: ${REDIS_PREFIX:-starter}
      REDIS_DEFAULT_TTL: ${REDIS_DEFAULT_TTL:-300}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-starter-prismakit-minio-production}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_PRESIGN_ENDPOINT: ${MINIO_PRESIGN_ENDPOINT:-}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-starter}
    depends_on:
      starter-prismakit-database-postgres-production:
        condition: service_healthy
      starter-prismakit-redis-production:
        condition: service_healthy
      starter-prismakit-minio-production:
        condition: service_healthy
    networks:
      - starter-network
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health', (r)=>process.exit(r.statusCode===200?0:1)).on('error', ()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  starter-prismakit-database-postgres-production:
    container_name: starter-prismakit-database-postgres-production
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - starter-postgres-production-data:/var/lib/postgresql/data
    networks:
      - starter-network
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  starter-prismakit-redis-production:
    container_name: starter-prismakit-redis-production
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - starter-redis-production-data:/data
    networks:
      - starter-network
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  starter-prismakit-minio-production:
    container_name: starter-prismakit-minio-production
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - starter-minio-production-data:/data
    networks:
      - starter-network
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  starter-postgres-production-data:
  starter-redis-production-data:
  starter-minio-production-data:

networks:
  starter-network:
    external: true
